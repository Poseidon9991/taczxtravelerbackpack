# Gradle JVM settings - max heap for the build, no daemon (cleaner for FG)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties
# Which Minecraft/Forge/mappings we build against.
# NOTE: .properties files do NOT support trailing comments - keep comments
# on their own line or they become part of the value.

minecraft_version=1.20.1
# mods.toml: this mod works on 1.20.1 only
minecraft_version_range=[1.20.1,1.21)

forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=parchment
mapping_version=2023.08.20-1.20.1


## Mod Properties
mod_id=tacz_tb_compat
mod_name=[TaCZ] Travelers Backpack Compatibility
mod_license=MIT
mod_version=1.0.3
mod_group_id=com.poseidon.tacz_tb_compat
mod_authors=Poseidon
mod_description=Allows TaCZ guns to detect and consume ammo stored inside Travelers Backpacks (worn or carried in the player inventory).
