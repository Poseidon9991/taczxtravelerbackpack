// ==================== PLUGINS ====================
plugins {
    id 'eclipse'                                              // eclipse IDE import support
    id 'idea'                                                 // IntelliJ import support
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'        // ForgeGradle 6 - THE Minecraft/Forge toolchain
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'  // adds community "parchment" mappings
    id 'org.spongepowered.mixin' version '0.7.+'              // MixinGradle - refmaps + annotation processor
}

// Values come from gradle.properties - keeps versions/metadata in one place
version = mod_version        // e.g. 1.0.0 -> becomes the jar name suffix
group = mod_group_id         // maven-style group for publishing

base {
    archivesName = mod_id    // jar filename base -> tacz_tb_compat-<version>.jar
}

// This mod needs Java 17 (Minecraft 1.20.1 requirement)
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Debug line printed during configuration - shows which JDK Gradle runs on
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// MixinGradle block: registers our mixin config so the annotation processor
// generates the refmap (dev names -> obfuscated SRG names translation table)
mixin {
    // Refmap file name - written into the jar as tacz_tb_compat.refmap.json
    add sourceSets.main, "${mod_id}.refmap.json"
    // Our mixin config json in resources - defines which classes get patched
    config "${mod_id}.mixins.json"
}

// ==================== MINECRAFT / FORGE SETUP ====================
minecraft {

    // Which obfuscation mappings to develop against.
    // "parchment" = official Mojang names + community-added parameter names/docs.
    mappings channel: mapping_channel, version: mapping_version

    // Copies resources into the IDE run output so IDE-launched games see them
    copyIdeResources = true

    // ---- Run configurations (gradlew runClient / runServer / runData) ----
    runs {

        // Shared settings applied to EVERY run config below
        configureEach {
            // The game runs from ./run (keeps crashes/logs/mods out of the repo root)
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'            // log registry activity
            property 'forge.logging.console.level', 'debug'           // verbose console logging

            // Tell Mixin to translate dev names -> production (SRG) names using
            // the mapping file ForgeGradle generates in build/createSrgToMcp
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Load OUR mod in dev runs (mod classes from src/main)
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        // gradlew runClient - launches a dev Minecraft client
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // gradlew runServer - headless dedicated server (--nogui skips its UI)
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // gradlew runData - runs datagen to generate json assets into src/generated
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include datagen output (if any) in the built jar
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ==================== REPOSITORIES ====================
repositories {

    // Mod jars dropped in by hand (TaCZ, Travelers Backpack). Not on a public
    // maven for compile use — download them and place under libs/<name>.jar
    flatDir {
        dirs 'libs'
    }
}

// ==================== DEPENDENCIES ====================
dependencies {

    // The Forge+MC dev bundle (versions from gradle.properties)
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin library + its annotation processor (generates the refmap at compile)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'
    testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // TaCZ — hard dependency; we mixin into its gun item + kinetic script API.
    // Raw production jar: we only call its own mod-defined APIs and mixin into
    // methods whose names are stable in dev and prod.
    implementation files('libs/tacz-1.20.1-1.1.8.jar')

    // Traveler's Backpack — hard dependency; we read its player capability and
    // BackpackWrapper storage handlers.
    implementation files('libs/travelersbackpack-forge-1.20.1-9.1.58.jar')
}

// ==================== RESOURCE PROCESSING ====================
// Replaces ${...} placeholders inside mods.toml / pack.mcmeta with real values
tasks.named('processResources', ProcessResources).configure {
    // Map of placeholder -> value pulled from gradle.properties
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    // Register the map so Gradle re-runs the task when values change
    inputs.properties replaceProperties

    // Only these files get placeholder expansion
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ==================== JAR OUTPUT ====================
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Extra safety net: some loaders read mixin config from the manifest too
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // After jar -> reobfJar: translate dev names back to production SRG names
    // so the jar works in a real Minecraft install
    finalizedBy 'reobfJar'
}

// Source files are UTF-8 - keeps javac happy with any special characters
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
